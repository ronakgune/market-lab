[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozlabs-market-lab"
version = "0.1.0"
description = "OzLabs research-first market intelligence and mock trading lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.15,<5",
  "ddgs>=9.14,<10",
  "httpx>=0.28,<1",
  "pypdf>=6.14,<7",
  "yfinance>=0.2.40",
]

[project.scripts]
market-lab-webapp = "market_lab.webapp:main"
market-lab-web-evidence = "market_lab.web_evidence_cli:main"
market-lab-prediction = "market_lab.prediction_markets.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
# Intraday foundation (market_lab.intraday): historical 1-minute bars, EDGAR
# earnings events, Parquet/DuckDB bar store. Exact pins, verified on PyPI
# 2026-11-05 (alpaca-py -> alpacahq/alpaca-py, edgartools -> dgunning/edgartools,
# duckdb -> duckdb/duckdb-python, pyarrow -> apache/arrow).
intraday = [
  "alpaca-py==0.45.0",
  "duckdb==2.0.0",
  "edgartools==5.62.1",
  "pyarrow==26.0.1",
]

[tool.setuptools.packages.find]
include = ["market_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests/market_lab"]
pythonpath = ["."]
